name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      # The three curated workflows, scored against the gold fixtures through
      # the public API with the deterministic contract fakes: no provider
      # credential, no network call, no variable cost. It fails if the committed
      # summary that System details serves has drifted from what a fresh
      # evaluation measures.
      - name: Evaluate reference fixtures
        run: node scripts/run-evaluation.mjs --check
