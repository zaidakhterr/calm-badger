name: Langfuse experiment gate

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  experiment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: npx -y pnpm@11.21.0 install --frozen-lockfile

      - name: Build client
        run: npx -y pnpm@11.21.0 build:client

      - name: Apply local D1 migrations
        run: npx -y pnpm@11.21.0 db:migrate:local

      - name: Seed local D1 database
        run: npx -y pnpm@11.21.0 db:seed:local

      - name: Start local Worker
        env:
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          printf '%s\n' \
            "APP_ENV=development" \
            "ANALYTICS_PROVIDER=none" \
            "POSTHOG_API_KEY=" \
            "RATE_LIMIT_SALT=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "MISTRAL_API_KEY=${MISTRAL_API_KEY}" \
            "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" \
            "LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}" \
            "LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}" \
            "LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}" > .dev.vars
          nohup npx -y pnpm@11.21.0 exec wrangler dev --local --port 8787 > "${RUNNER_TEMP}/wrangler.log" 2>&1 &
          worker_pid=$!
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "${worker_pid}" 2> /dev/null; then
              echo "The local Worker stopped before it became ready."
              exit 1
            fi
            sleep 1
          done
          echo "The local Worker did not become ready within 60 seconds."
          exit 1

      - name: Run Langfuse experiment
        uses: langfuse/experiment-action@b945f9bf921b24a4074306078f621cba729d173e # v1.0.10
        env:
          RFQ_BASE_URL: http://127.0.0.1:8787
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: ${{ secrets.LANGFUSE_BASE_URL }}
          experiment_path: evals/rfq.ts
          dataset_name: rfq-scenarios
          should_skip_sdk_installation: "true"
          should_fail_on_regression: "true"
          should_fail_on_script_error: "true"
          should_comment_on_pr: "true"
          github_token: ${{ github.token }}
