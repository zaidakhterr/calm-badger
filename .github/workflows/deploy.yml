name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting, linting, the wizard's structural check, the generated-data
      # check, the Worker integration tests, type generation, and the build —
      # including `wrangler deploy --dry-run`, so the bundle that is about to
      # ship is compiled before anything external is touched.
      - name: Validate application
        run: pnpm check

      # The same fixture evaluation the validate workflow runs, repeated here
      # because this is the only path that deploys. It replays the three
      # curated workflows through the deterministic contract fakes and fails if
      # the committed summary that System details serves has drifted, so a
      # deployment can never advertise numbers it does not reproduce.
      - name: Evaluate reference fixtures
        run: node scripts/run-evaluation.mjs --check

      # Additive only. Deployment applies migrations; it never imports seed
      # data, so accumulated demo state survives every deploy. Seeding is an
      # explicit `pnpm db:seed:remote` (or one confirmed wizard step), and the
      # seed itself is `INSERT OR IGNORE`, so even that cannot overwrite rows.
      - name: Apply additive D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
